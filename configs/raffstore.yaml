esphome:
  name: elero-raffstore
  friendly_name: Raffstore
  min_version: 2026.9.1

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: VERBOSE
  logs:
    sensor: WARN
    api: INFO
    elero.rf: VERBOSE

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  actions:
    - action: elero_rf_debug
      variables:
        command: int
        frame_type: int
        type2: int
        hop: int
        destination: int
        payload_1: int
        payload_2: int
        packets: int
      then:
        - lambda: |-
            id(raffstore).debug_send(command, frame_type, type2, hop,
                                    destination, payload_1, payload_2, packets);
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

external_components:
  - source:
      type: local
      path: ../components
    components: [elero]

spi:
  clk_pin: GPIO12
  mosi_pin: GPIO10
  miso_pin: GPIO8

elero:
  id: radio
  cs_pin: GPIO6
  gdo0_pin: GPIO4

cover:
  - platform: elero
    id: raffstore
    name: Raffstore
    device_class: blind
    status_address: 0x300001
    command_address: 0x200001
    remote_address: 0x100001
    channel: 17
    # Use feedback until both full travel durations have been measured.
    # Then select timed; endpoint estimates remain visibly marked in Status.
    state_strategy: feedback
    open_duration: 0s
    close_duration: 0s
    endpoint_margin: 2s
    tilt: false
    # Uses this fork's captured MonoTel 2 command profile.

sensor:
  - platform: elero
    cover_id: raffstore
    name: RF RSSI
  - platform: elero
    elero_id: radio
    tx_success:
      name: RF TX Success
    tx_fail:
      name: RF TX Failure
    rx_packets:
      name: RF RX Packets
    rx_drops:
      name: RF RX Drops
    last_rx_age:
      name: RF Last RX Age

button:
  - platform: elero
    cover_id: raffstore
    action: short_up
    name: Short Up
    icon: mdi:arrow-up
  - platform: elero
    cover_id: raffstore
    action: long_up
    name: Long Up
    icon: mdi:arrow-up-bold
  - platform: elero
    cover_id: raffstore
    action: short_down
    name: Short Down
    icon: mdi:arrow-down
  - platform: elero
    cover_id: raffstore
    action: long_down
    name: Long Down
    icon: mdi:arrow-down-bold
  - platform: elero
    cover_id: raffstore
    action: stop
    name: Stop
    icon: mdi:stop
  - platform: elero
    cover_id: raffstore
    name: "查询状态"

text_sensor:
  - platform: elero
    cover_id: raffstore
    rf_state:
      name: RF State
    position_source:
      name: Position Source
    transition_reason:
      name: Transition Reason
