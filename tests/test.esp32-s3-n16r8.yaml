# ESPHome compile test: ESP32 with Native+NVS mode
substitutions:
  spi_clk: GPIO12
  spi_mosi: GPIO10
  spi_miso: GPIO8
  spi_cs: GPIO6
  gdo0_pin: GPIO4

esphome:
  name: test-esp32-s3-n16r8
  friendly_name: Test ESP32 NVS

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG

wifi:
  ssid: "test-network"
  password: ""

api:

external_components:
  - source:
      type: local
      path: ../components

spi:
  clk_pin: ${spi_clk}
  mosi_pin: ${spi_mosi}
  miso_pin: ${spi_miso}

# Elero hub (no YAML covers/lights — devices managed via NVS)
elero:
  cs_pin: ${spi_cs}
  gdo0_pin: ${gdo0_pin}

# Native+NVS mode (NVS persistence on the device registry)
elero_nvs:

# Web UI for RF discovery and device management
elero_web:
  port: 80
