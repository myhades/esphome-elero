name: Optional firmware build
on: workflow_dispatch
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
      - run: uv sync --locked
      - run: uv run esphome compile tests/test.esp32-s3-n16r8.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: raffstore-n16r8
          path: tests/.esphome/build/test-esp32-s3-n16r8/build/firmware*.bin
